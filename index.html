<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Command">
<meta name="description" content="Calendar, agenda, finance, health and reflection on one dial.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mobile Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Themes ============ */
:root,[data-theme=noir]{--bg:#000;--s1:#0e0e0e;--s2:#1a1a1a;--s3:#2a2a2a;--line:#252525;--tx:#f4f4f4;--mut:#8a8a8a;--acc:#fff;--accInk:#000;--ring1:#fff;--ring2:#fff;--glass:rgba(0,0,0,.8);--node:#0e0e0e;--sheet:#0c0c0c;--pos:#7fd6a0;--neg:#f08a8a;--sav:#d9d9d9;--shadow:0 12px 32px rgba(0,0,0,.7);color-scheme:dark}
[data-theme=paper]{--bg:#fff;--s1:#f6f6f6;--s2:#ececec;--s3:#d9d9d9;--line:#e4e4e4;--tx:#0b0b0b;--mut:#6f6f6f;--acc:#0b0b0b;--accInk:#fff;--ring1:#0b0b0b;--ring2:#0b0b0b;--glass:rgba(255,255,255,.85);--node:#fff;--sheet:#fff;--pos:#1b7f47;--neg:#c03a2b;--sav:#0b0b0b;--shadow:0 12px 32px rgba(0,0,0,.12);color-scheme:light}
[data-theme=midnight]{--bg:#0a1730;--s1:rgba(24,43,80,.72);--s2:rgba(38,61,104,.78);--s3:rgba(62,88,136,.85);--line:rgba(175,190,215,.16);--tx:#e9edf3;--mut:#8f9bb1;--acc:#d3d8e0;--accInk:#0a1730;--ring1:#f5f7fa;--ring2:#7d889e;--glass:rgba(9,20,42,.82);--node:#12244a;--sheet:#0f1e3d;--pos:#8fd9b0;--neg:#f2a0a0;--sav:#d3d8e0;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html[data-theme=midnight] body{background:radial-gradient(130% 70% at 50% -15%,#1b3a78 0%,#0d1e40 42%,#081226 100%) fixed}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--mut)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{resize:vertical;line-height:1.5}
input[type=date],input[type=time]{min-height:40px}
.ic{width:20px;height:20px;flex:none;display:block}
.emo{font-style:normal}
body.mono .emo,body.mono .em,body.mono .dr-pick,body.mono .ci{filter:grayscale(1)}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.row{display:flex;align-items:center}.g8{gap:8px}.grow{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.h1{font-size:30px;font-weight:650;letter-spacing:-.025em;line-height:1.1;margin-top:3px}
html[data-theme=midnight] .h1,html[data-theme=midnight] .home-date,html[data-theme=midnight] .big-num,html[data-theme=midnight] .digital .t{background:linear-gradient(180deg,#fbfcfd 0%,#b9c1ce 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;font-weight:650;letter-spacing:-.02em}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
h4{font-size:15px;font-weight:600}
.muted{color:var(--mut)}.tiny{font-size:12px}
.hint{font-size:13px;color:var(--mut);line-height:1.45}.hint.pad{padding:4px 14px 12px}
.empty{color:var(--mut);font-size:14px;padding:14px 0 4px;text-align:center}.empty.sm{font-size:13px;padding:8px 0;text-align:left}

/* buttons */
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);flex:none}
.icon-btn.xs{width:30px;height:30px;background:none;border:0}.icon-btn.xs .ic{width:18px;height:18px}
.icon-btn:active,.btn:active,.cell:active,.ev:active,.note:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:550;font-size:14px;white-space:nowrap;transition:transform .12s}
.btn .ic{width:16px;height:16px}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.primary{background:var(--acc);color:var(--accInk);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg)}
.btn.wide{width:100%;height:48px;font-size:15px}
.txt-btn{font-weight:500;color:var(--mut);padding:6px 4px;min-width:60px}
.txt-btn.strong{color:var(--tx);font-weight:650;text-align:right}
.danger-btn{color:var(--neg);font-weight:600;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:center}
.fab{position:fixed;right:max(18px,calc(50vw - 262px));bottom:calc(env(safe-area-inset-bottom) + 84px);width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;box-shadow:var(--shadow);z-index:15;transition:transform .15s}
.fab .ic{width:26px;height:26px;stroke-width:2}
.fab:active{transform:scale(.92)}

/* segmented */
.seg-wrap{display:flex;justify-content:center;margin:14px 0}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg>button,.chips.seg .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:550;color:var(--mut);border:0;background:none;transition:background .2s,color .2s}
.seg>button .ic{width:16px;height:16px}
.seg>button.on,.chips.seg .chip.on{background:var(--acc);color:var(--accInk)}
.chips.seg.sm .chip{padding:6px 12px;font-size:13px}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.grp-title{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 4px 8px}

/* ============ Nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.3) blur(18px);backdrop-filter:saturate(1.3) blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:10px;font-weight:550;color:var(--mut);letter-spacing:.02em;text-align:center}
.nav button span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on{color:var(--tx)}
.nav button.on::before{content:'';position:absolute;top:-6px;width:18px;height:2px;border-radius:2px;background:var(--tx)}
.nav .ic{width:23px;height:23px}

/* ============ Home ============ */
.home-top{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 0}
.home-date{font-size:26px;font-weight:650;letter-spacing:-.025em;margin-top:3px}
.dial-wrap{width:100%;max-width:440px;margin:4px auto 0;aspect-ratio:1/1;position:relative}
.dial{width:100%;height:100%;display:block;overflow:visible;font-family:inherit}
.ring{fill:none;stroke:url(#ringG);stroke-width:1.6}
.ring-in{fill:none;stroke:var(--line);stroke-width:1;opacity:0;transition:opacity .6s}
.tk{stroke:var(--mut);stroke-width:1;opacity:0;transition:opacity .6s}
.tk.h{stroke:var(--tx);stroke-width:2.2;stroke-linecap:round}
.numl{fill:var(--mut);font-size:15px;font-weight:500;text-anchor:middle;opacity:0;transition:opacity .6s}
.tree{transition:opacity .7s ease}
.tree .trunk{fill:var(--tx)}
.tree .br{fill:none;stroke:var(--tx);stroke-width:2.6;stroke-linecap:round}
.tree .root{fill:none;stroke:var(--tx);stroke-width:1.6;stroke-linecap:round}
.tree .twig{fill:none;stroke:var(--mut);stroke-width:1.3;stroke-linecap:round}
.tree .leaf{fill:var(--mut)}
.hub{fill:var(--tx)}
.arc{fill:none;stroke-width:6;stroke-linecap:round;opacity:0;transition:opacity .6s}
.hands{opacity:0;transition:opacity .6s}
.hand{stroke:var(--tx);stroke-linecap:round}
.hand.hh{stroke-width:5.5}.hand.mh{stroke-width:3.2}.hand.sh{stroke:var(--acc);stroke-width:1.4;opacity:.85}
.cap{fill:var(--bg);stroke:var(--tx);stroke-width:2.2}
.node{cursor:pointer;outline:none}
.node-c{fill:var(--node);stroke:var(--tx);stroke-width:1.6;transition:fill .2s}
.node:active .node-c,.node:focus-visible .node-c{fill:var(--s3)}
.node-i{color:var(--tx);pointer-events:none}
.node-l{fill:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.15em;pointer-events:none}
.badge-c{fill:var(--acc)}.badge-t{fill:var(--accInk);font-size:11px;font-weight:700;text-anchor:middle}
.is-clock .tree{opacity:var(--treeOp,0)}
.is-clock .tk{opacity:.55}.is-clock .tk.h{opacity:1}.is-clock .numl{opacity:1}
.is-clock .hands{opacity:1}.is-clock .arc{opacity:.95}.is-clock .ring-in{opacity:1}
.is-clock .node-l{opacity:.0}
.node-l{transition:opacity .5s}
.digital{display:none;text-align:center;margin-top:-6px}
.is-clock + .digital{display:block}
.digital .t{font-size:52px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.digital .t small{font-size:18px;font-weight:500;letter-spacing:.06em;margin-left:6px;color:var(--mut)}
html[data-theme=midnight] .digital .t small{-webkit-text-fill-color:var(--mut)}
.digital .nx{font-size:13px;color:var(--mut);margin-top:8px}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.gl{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px;text-align:left;transition:transform .12s}
.gl:active{transform:scale(.97)}
.gl.wide{grid-column:1/-1;min-height:0}
.gl .gl-top{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.gl .gl-top .ic{width:15px;height:15px}
.gl b{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gl small{color:var(--mut);font-size:12.5px}
.gl.wide b{font-weight:500;font-size:16px}
.prog{height:5px;background:var(--s3);border-radius:9px;overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:var(--c,var(--tx));border-radius:9px}
body.focus .home-top,body.focus .glance,body.focus .seg-wrap,body.focus .nav,body.focus .fab{display:none}
body.focus .app{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:20px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
body.focus .dial-wrap{max-width:min(92vw,78vh)}
.focus-exit{display:none}
body.focus .focus-exit{display:grid;position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:5}

/* ============ Calendar ============ */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month-title{font-size:20px;font-weight:650;letter-spacing:-.02em}
.month-title span{color:var(--mut);font-weight:400}
.cal{padding:12px 8px 8px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.1em;margin-bottom:6px}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{position:relative;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding-top:5px;transition:background .15s}
.cell .dn{font-size:15px;font-weight:500;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.out{opacity:.3}
.cell.today .dn{background:var(--acc);color:var(--accInk);font-weight:700}
.cell.sel{background:var(--s2)}
.cell.sel:not(.today) .dn{box-shadow:inset 0 0 0 1.5px var(--tx)}
.cell .ci{position:absolute;top:2px;right:2px;font-size:10px;line-height:1}
.dots{display:flex;gap:3px;margin-top:4px;height:6px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
.dot.h{border-radius:1px;transform:rotate(45deg);width:5px;height:5px}
.dots .more{font-style:normal;font-size:9px;color:var(--mut);line-height:1}
.day-panel .dp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-of-type{border-top:0}
.item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none;min-height:30px}
.item .it-t{font-weight:550;font-size:15px}
.item .it-s{font-size:12.5px;color:var(--mut);margin-top:1px;display:flex;gap:6px;align-items:center}
.item .it-s .ic{width:13px;height:13px}
.up-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.up-row:first-of-type{border-top:0}
.up-date{width:44px;text-align:center;flex:none}
.up-date b{display:block;font-size:18px;font-weight:650;line-height:1}
.up-date small{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

/* ============ Agenda ============ */
.date-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh-mid{text-align:center;flex:1}
.dh-mid h2{margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;border:1px solid transparent}
.wd small{font-size:11px;color:var(--mut);font-weight:600}
.wd b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wd .dt{width:4px;height:4px;border-radius:50%;background:var(--mut);opacity:0}
.wd .dt.y{opacity:1}
.wd.today{border-color:var(--line)}
.wd.on{background:var(--acc);color:var(--accInk)}
.wd.on small{color:inherit;opacity:.65}.wd.on .dt{background:var(--accInk)}
.today-chip{display:flex;justify-content:center;margin:-4px 0 10px}
.ag-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}
.pill-row{display:flex;flex-direction:column;gap:8px}
.hcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;width:100%;text-align:left}
.hcard .hc-emoji{font-size:22px;width:30px;text-align:center}
.hcard b{display:block;font-size:15px;font-weight:600}
.hcard small{font-size:12.5px;color:var(--mut)}
.done-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;flex:none}
.done-btn .ic{width:17px;height:17px}
.done-btn.on{background:var(--acc);color:var(--accInk);border-color:transparent}
.ev{display:grid;grid-template-columns:64px 4px 1fr;gap:12px;padding:13px 14px;margin-bottom:8px;background:var(--s1);border:1px solid var(--line);border-radius:18px;width:100%;text-align:left;transition:transform .12s}
.ev-time b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.ev-time small{display:block;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ev-bar{border-radius:4px;background:var(--c)}
.ev-title{font-weight:600;font-size:15.5px;line-height:1.3}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--mut);align-items:center}
.ev-meta .ic{width:13px;height:13px}
.ev.past{opacity:.48}
.ev.allday{grid-template-columns:4px 1fr;padding:11px 14px}
.chipx{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-weight:550}
.chipx.ok{color:var(--tx);border-color:var(--mut)}
.now{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;color:var(--tx);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.now::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--tx)}
.now::after{content:'';flex:1;height:1.5px;background:var(--tx)}

/* ============ Finance ============ */
.fin-sum .big-num{font-size:38px;font-weight:650;letter-spacing:-.03em;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.fin-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fin-row small{display:block;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.fin-row b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.sav{color:var(--sav)}
.sheet-tools{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.sheet-tools b{font-size:16px}
.xl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--s1);-webkit-overflow-scrolling:touch}
.xl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px}
.xl th,.xl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;white-space:nowrap}
.xl th:last-child,.xl td:last-child{border-right:0}
.xl thead th{background:var(--s2);font-weight:600;font-size:12px;color:var(--mut)}
.xl thead .letters th{font-size:10px;padding:3px 8px;text-align:center;letter-spacing:.12em;font-weight:500}
.xl .rn{width:30px;text-align:center;color:var(--mut);background:var(--s2);font-size:11px;padding-left:4px;padding-right:4px}
.xl td.it{max-width:132px;overflow:hidden;text-overflow:ellipsis}
.xl td.it .ic{display:inline-block;width:12px;height:12px;vertical-align:-1px;color:var(--mut)}
.xl .cat{font-size:12px;color:var(--mut)}
.xl tbody tr{cursor:pointer}
.xl tbody tr:active td{background:var(--s2)}
.xl tfoot td{font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.xl tfoot tr:last-child td{border-bottom:0;color:var(--tx);background:var(--s2)}
.xl .empty-row td{color:var(--mut);font-style:italic}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.add-row{display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);font-weight:550;text-align:center}
.bar-row{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.bar-row .bar{height:8px;border-radius:8px;background:var(--s3);overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--tx);border-radius:8px}
.bar-row b{font-variant-numeric:tabular-nums;font-weight:600}
.goal .g-top{display:flex;gap:12px;align-items:center}
.goal .g-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--s2);border:1px solid var(--line);flex:none}
.goal .g-top small{display:block;color:var(--mut);font-size:12.5px}
.goal .prog{height:8px;margin:14px 0 8px}
.goal .g-nums{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.goal .g-nums b{color:var(--tx);font-size:16px}
.goal .g-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.goal .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acct{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.acct:first-of-type{border-top:0}
.acct b{font-variant-numeric:tabular-nums;font-size:16px}
.acct-ic{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ============ Health ============ */
.today-split{border-left:4px solid var(--c)}
.ts-top{display:flex;align-items:center;gap:12px}
.ts-emoji{font-size:30px;width:54px;height:54px;border-radius:16px;background:var(--s2);display:grid;place-items:center;flex:none}
.ts-list{list-style:none;margin-top:12px;border-top:1px solid var(--line)}
.ts-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.ts-list li:last-child{border-bottom:0}
.ts-list li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);margin-top:8px;flex:none}
.rest-tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mut);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wk-strip div{text-align:center;padding:7px 0;border-radius:12px;background:var(--s2);font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px;align-items:center}
.wk-strip div.t{background:var(--acc);color:var(--accInk)}
.wk-strip span{font-size:17px}
.trk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.trk{margin:0;padding:14px;display:flex;flex-direction:column;gap:8px}
.trk-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin:-4px -6px -4px 0}
.trk-val{cursor:pointer}
.trk-val b{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trk-val small{color:var(--mut);font-size:12.5px;margin-left:4px}
.trk-btns{display:flex;align-items:center;gap:8px}
.trk-btns button{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--line);font-size:18px;font-weight:600;display:grid;place-items:center;flex:none}
.spark{flex:1;height:26px;display:flex;align-items:flex-end;gap:3px}
.spark i{flex:1;background:var(--mut);opacity:.5;border-radius:2px;min-height:2px}
.spark i:last-child{background:var(--tx);opacity:1}
.trk.add{align-items:center;justify-content:center;color:var(--mut);font-weight:600;border-style:dashed;min-height:120px}
.lib-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lib-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lib-row:first-of-type{border-top:0}
.lib-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.lib-emoji{width:42px;height:42px;border-radius:13px;background:var(--s2);display:grid;place-items:center;font-size:20px;flex:none}
.lib-main b{display:block;font-size:15px}
.lib-main small{display:block;color:var(--mut);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:6px 11px;border-radius:99px;background:var(--acc);color:var(--accInk)}
.badge .ic{width:14px;height:14px}

/* ============ Reflect ============ */
.prompt{position:relative;overflow:hidden}
.prompt-q{font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:8px 0 14px;font-family:ui-serif,"New York",Georgia,serif}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:7px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:550;color:var(--mut);white-space:nowrap}
.fchip.on{background:var(--acc);color:var(--accInk);border-color:transparent}
.search{margin-bottom:12px}
.notes.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:16px;padding:13px 14px;margin-bottom:10px;transition:transform .12s}
.notes.grid .note{margin:0;min-height:120px}
.note-top{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.note-top .ic{width:13px;height:13px;color:var(--tx)}
.note-top .mood{margin-left:auto;font-size:15px;letter-spacing:0}
.note h4{margin-top:6px;font-size:16px;line-height:1.3}
.note .ex{margin-top:4px;font-size:14px;color:var(--mut);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.notes.grid .note .ex{-webkit-line-clamp:4}
.note-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--mut)}
.note-foot .tag{color:var(--tx);opacity:.8}
.notes.compact .note{padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.notes.compact .note h4{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-serif{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif!important}
.font-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace!important}

/* ============ Settings ============ */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{border:1.5px solid var(--line);border-radius:18px;padding:8px;background:var(--s1);display:flex;flex-direction:column;gap:6px;text-align:left}
.theme-card.on{border-color:var(--tx)}
.theme-card b{font-size:13.5px;padding:0 2px}.theme-card small{font-size:11px;color:var(--mut);padding:0 2px 2px;line-height:1.3}
.tp{border-radius:12px;background:var(--bg);aspect-ratio:1/1;display:grid;place-items:center;border:1px solid var(--line)}
.tp[data-theme=midnight]{background:radial-gradient(120% 80% at 50% 0%,#1b3a78,#0a1730 70%)}
.tp svg{width:78%;height:78%}
.sync-line{display:flex;align-items:center;gap:10px}
.qr-box{background:#fff;border-radius:18px;padding:12px;width:min(260px,68vw);margin:0 auto;box-shadow:var(--shadow)}
.qr-box svg{display:block;width:100%;height:auto}
.qr-url{font-size:12px;color:var(--mut);text-align:center;word-break:break-all}
.qr-modes{display:flex;gap:8px}.qr-modes .btn{flex:1}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
body.demo::after{content:"Demo";position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mut);z-index:40;pointer-events:none}
.about{text-align:center;color:var(--mut);font-size:12px;margin:26px 0 8px}

/* ============ Sheets & forms ============ */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1);padding-bottom:calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.small{max-height:80dvh}
.sheet-wrap.open .scrim{opacity:1}.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:5px;background:var(--s3);margin:8px auto 0}
.sh-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 12px;background:var(--sheet);border-bottom:1px solid var(--line);z-index:3}
.sh-head b{font-size:16px}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.big-input{font-size:22px;font-weight:600;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px}
.big-input:focus{border-color:var(--tx)}
.amount-input{font-size:34px;font-weight:650;text-align:center;letter-spacing:-.02em;background:transparent;border:0;font-variant-numeric:tabular-nums}
.field .flabel{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 2px 8px}
.group{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;min-height:50px;border-top:1px solid var(--line)}
.group>.line:first-child,.group>.fin-fields>.line:first-child{border-top:0}
.fin-fields{border-top:1px solid var(--line)}
.line>span:first-child{flex:none;max-width:52%}
.line input:not([type=checkbox]),.line select{width:auto;min-width:0;max-width:62%;flex:0 1 auto;background-color:var(--s2);border:0;text-align:right;padding:8px 10px}
.line select{padding-right:28px}
.line .iv{display:flex;align-items:center;gap:8px}
.line .iv input{width:64px;text-align:center}
.line .iv em{font-style:normal;color:var(--mut);font-size:14px}
.line .chips{flex:1}
.tog{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.tog span{position:absolute;inset:0;background:var(--s3);border-radius:99px;transition:.2s}
.tog span::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--mut);transition:.2s}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(20px);background:var(--accInk)}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.sw{aspect-ratio:1/1;border-radius:50%;background:var(--c);border:1px solid var(--line);position:relative;display:block;cursor:pointer;max-width:38px}
.sw.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--tx)}
.sw.custom{background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444);overflow:hidden}
.sw.custom.on{background:var(--c)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.emojis{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:142px;overflow-y:auto;padding:2px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.em{font-size:22px;height:42px;border-radius:12px;display:grid;place-items:center}
.em.on{background:var(--s3);box-shadow:inset 0 0 0 1.5px var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:550;color:var(--mut)}
.chip.on{background:var(--acc);color:var(--accInk);border-color:transparent}
.chips.seg{flex-wrap:nowrap;background:var(--s2);border:0;padding:3px;border-radius:999px;display:flex}
.chips.seg .chip{flex:1;justify-content:center;text-align:center;padding:8px 6px}
.daychips{justify-content:space-between;flex-wrap:nowrap;width:100%}
.daychips .chip{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:13px}
.confirm h3{font-size:18px}.stack{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dayrow{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.dr-head{display:flex;align-items:center;gap:8px}
.dr-label{width:44px;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);flex:none}
.dr-pick{width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:20px;flex:none;display:grid;place-items:center}
.dr-name{flex:1;min-width:0;padding:9px 10px}
.dr-rest{font-size:12px;font-weight:600;padding:7px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);flex:none}
.dr-rest.on{background:var(--acc);color:var(--accInk);border-color:transparent}
.dr-details{font-size:14px;min-height:44px;padding:8px 10px}
.hset{padding:12px 14px;margin:0}
.hset.off{opacity:.62}
.hset-head{display:flex;align-items:center;gap:12px}
.hset-head b{font-size:15px;display:block}
.hset-head small{display:block;font-size:12px;color:var(--mut);line-height:1.35;margin-top:2px}
.hs-color{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line);flex:none}
.hs-color.sm{width:20px;height:20px;border-width:1.5px}
.hset details{margin-top:10px}
.hset summary{font-size:13px;color:var(--mut);cursor:pointer;padding:4px 0;list-style:none}
.hset summary::before{content:'›';display:inline-block;margin-right:8px;transition:transform .2s}
.hset details[open] summary::before{transform:rotate(90deg)}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hrow small{display:block;font-size:12px;color:var(--mut)}
.hrow.off span{text-decoration:line-through;color:var(--mut)}
.hrow .ic{width:16px;height:16px;color:var(--mut)}
.dotc{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1}
.trow .dr-pick{width:44px;height:44px}
.range{width:100%;padding:0;height:30px;background:none;border:0;accent-color:var(--tx);-webkit-appearance:auto;appearance:auto}
.welcome{align-items:center;text-align:center;padding-top:8px}
.welcome p{color:var(--mut);max-width:340px;line-height:1.5}
.w-list{list-style:none;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;margin:4px 0 6px}
.w-list li{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;font-size:14px}
.w-list li .ic{width:20px;height:20px}
.w-dial{width:140px;height:140px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);background:var(--acc);color:var(--accInk);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){.app{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* ============ Underwater glass (v0.2) ============ */
:root,[data-theme=noir]{--bg:#020304;--s1:rgba(255,255,255,.055);--s2:rgba(255,255,255,.09);--s3:rgba(255,255,255,.16);--line:rgba(255,255,255,.11);--glass:rgba(6,8,10,.55);--node:#0b0d0f;--glassHi:rgba(255,255,255,.34);--glassMid:rgba(255,255,255,.07);--glassLo:rgba(255,255,255,.02);--ray:rgba(255,255,255,.05);--bub:rgba(255,255,255,.35);--treeA:.22;--treeB:.09;--sea1:#0b0f12;--sea2:#020304}
[data-theme=paper]{--bg:#eef1f4;--s1:rgba(255,255,255,.62);--s2:rgba(255,255,255,.85);--s3:rgba(0,0,0,.09);--line:rgba(0,0,0,.08);--glass:rgba(244,247,250,.6);--node:#fff;--glassHi:rgba(255,255,255,.98);--glassMid:rgba(255,255,255,.6);--glassLo:rgba(220,228,236,.45);--ray:rgba(255,255,255,.75);--bub:rgba(0,0,0,.22);--treeA:.2;--treeB:.08;--sea1:#f9fbfc;--sea2:#e3e8ee}
[data-theme=midnight]{--s1:rgba(120,160,230,.08);--s2:rgba(140,175,235,.13);--s3:rgba(160,190,240,.22);--line:rgba(190,210,240,.15);--glass:rgba(6,18,42,.55);--glassHi:rgba(225,236,255,.42);--glassMid:rgba(120,160,230,.12);--glassLo:rgba(40,80,160,.05);--ray:rgba(150,195,255,.09);--bub:rgba(200,225,255,.45);--treeA:.26;--treeB:.11;--sea1:#123a7a;--sea2:#06112a}
html[data-theme] body{background:linear-gradient(180deg,var(--sea1) 0%,var(--sea2) 75%) fixed}
.ocean{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.app,.nav{position:relative;z-index:1}.nav{position:fixed}
.rays{position:absolute;inset:-20% -40% 30%;background:repeating-linear-gradient(100deg,transparent 0 46px,var(--ray) 52px 70px,transparent 78px 130px);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%);transform-origin:50% 0;animation:sway 14s ease-in-out infinite alternate;filter:blur(6px)}
.caustic{position:absolute;inset:-30%;background:radial-gradient(40% 25% at 30% 20%,var(--ray),transparent 70%),radial-gradient(35% 22% at 70% 35%,var(--ray),transparent 70%),radial-gradient(30% 20% at 45% 60%,var(--ray),transparent 70%);animation:drift 22s ease-in-out infinite alternate;opacity:.9}
.bubbles i{position:absolute;bottom:-30px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;border:1px solid var(--bub);background:radial-gradient(circle at 32% 30%,var(--bub),transparent 55%);opacity:0;animation:rise var(--t) linear var(--d) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}50%{transform:translate(14px,-55vh)}90%{opacity:.5}100%{transform:translate(-6px,-110vh);opacity:0}}
@keyframes sway{0%{transform:rotate(-4deg) translateX(-2%)}100%{transform:rotate(4deg) translateX(2%)}}
@keyframes drift{0%{transform:translate(-3%,-2%) scale(1)}100%{transform:translate(3%,3%) scale(1.08)}}
.card,.gl,.icon-btn,.seg,.ev,.hcard,.note,.xl-wrap,.group,.theme-card,.fchip,.wd.today{-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
[data-theme=paper] .card,[data-theme=paper] .gl,[data-theme=paper] .ev,[data-theme=paper] .note,[data-theme=paper] .group{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 20px rgba(20,40,70,.06)}
.nav{-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
/* merged dial */
.merged .tree{transition:opacity .6s}
.merged .tree.near{opacity:var(--treeA)}
.merged .tree.deep{opacity:var(--treeB)}
.merged.no-tree .tree{opacity:0}
.merged .tree .br{stroke-width:2}.merged .tree .trunk{opacity:.8}
.merged .node-l{opacity:.75;font-size:11px}
.lens{pointer-events:none}
.node-c{stroke:var(--line);stroke-width:1.2}
[data-theme=paper] .node-c{stroke:rgba(0,0,0,.14)}
.node-halo{fill:none;stroke:var(--glassHi);stroke-width:1;opacity:.45}
.node-shine{fill:none;stroke:var(--glassHi);stroke-width:2.2;stroke-linecap:round;opacity:.8;pointer-events:none}
.node .node-c{fill-opacity:1}
.float{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.f1{animation-delay:-1.4s;animation-duration:8s}.f2{animation-delay:-2.8s;animation-duration:6.5s}.f3{animation-delay:-4.1s;animation-duration:7.5s}.f4{animation-delay:-5.3s;animation-duration:8.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.merged .hands{filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}

const CX = 200, CY = 200, R = 150;
function polar(a, r) { const t = (a * Math.PI) / 180; return [+(CX + r * Math.sin(t)).toFixed(2), +(CY - r * Math.cos(t)).toFixed(2)]; }
function arcPath(r, a1, sweep) {
  sweep = Math.min(Math.max(sweep, 0.5), 359.5);
  const [x1, y1] = polar(a1, r), [x2, y2] = polar(a1 + sweep, r);
  return `M${x1} ${y1}A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${x2} ${y2}`;
}
function clockArcs(Hh) {
  const span = Hh * 60, T = todayYmd(), now = nowMinutes(), out = [];
  [[T, 0], [addDays(T, 1), 1440]].forEach(([d, off]) => {
    for (const { ev } of eventsOn(d)) {
      if (ev.allDay) continue;
      const s = minutesOf(ev.start) + off; let e = minutesOf(ev.end) + off; if (e <= s) e = s + 30;
      const s2 = Math.max(s, now), e2 = Math.min(e, now + span);
      if (e2 <= s2) continue;
      out.push({ a1: ((s2 % span) / span) * 360, sweep: ((e2 - s2) / span) * 360, color: ev.color });
    }
  });

}

/* ---------------- Daily agenda ---------------- */
function finLabel(f) {

  if (f.type === 'save') { const g = S.finance.goals.find(x => x.id === f.goalId); return `${amt} → ${g ? esc(g.name) : 'goal'}`; }
  return f.type === 'income' ? `+${amt} income` : `−${amt} ${esc(f.cat || 'expense')}`;
}
function finChip(ev, d) {

}

/* ---------------- Reflect & ideas ---------------- */
function filteredNotes() {
  const ns = S.settings.note, f = route.noteFilter, q = route.q.trim().toLowerCase();
  let list = S.notes.list.filter(n => (f === 'all' ? true : f === 'pinned' ? n.pinned : n.type === f));
  if (q) list = list.filter(n => (n.title + ' ' + n.body + ' ' + (n.tags || []).join(' ')).toLowerCase().includes(q));
  const by = { new: (a, b) => b.created - a.created, old: (a, b) => a.created - b.created, edited: (a, b) => b.updated - a.updated, az: (a, b) => (a.title || a.body).localeCompare(b.title || b.body) }[ns.sort] || ((a, b) => b.created - a.created);
  return list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || by(a, b));
}
function relStamp(ms) {
  const d = new Date(ms), T = new Date(); const same = d.toDateString() === T.toDateString();
  return same ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === T.getFullYear() ? undefined : 'numeric' });
}
function notesListH() {
  const ns = S.settings.note, types = S.settings.noteTypes, list = filteredNotes();
  if (!list.length) return `<div class="card"><p class="empty">${S.notes.list.length ? 'No notes match.' : 'Your reflections and ideas live here. Tap + to write the first one.'}</p></div>`;

function exportSheet() {

    const blob = new Blob([json], { type: 'application/json' });

      const file = new File([blob], name, { type: 'application/json' });

  }
  if (el.dataset.fincats) {
    const cats = el.value.split(',').map(s => s.trim()).filter(Boolean);
    if (cats.length) { S.finance.cats = [...new Set(cats)]; save('finance'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'noteQ') { route.q = e.target.value; const l = $('#notesList'); if (l) l.innerHTML = notesListH(); }
});

function onRemoteData(k) {
  if (k === 'settings') { applyTheme(); for (const y in _holMap) delete _holMap[y]; }
  if (S.settings.onboarded) { const w = sheets.find(s => s.dataset.welcome); if (w) closeSheet(w); }
  clearTimeout(onRemoteData._t);
  onRemoteData._t = setTimeout(() => { if (Cloud.ready && (k === 'schedule' || k === 'finance')) applyDueFinance(); render(); }, 60);
}

// Scheduled finance rows are posted once synced data is in, so two devices don't double-post.
function onCloudReady() { if (applyDueFinance()) render(); }
let lastMin = -1, lastDay = '';
function tick() {
  if (route.view === 'home') updateClock();
  const mm = nowMinutes(); if (mm === lastMin) return; lastMin = mm;
  const T = todayYmd();
  if (T !== lastDay) { lastDay = T; if (Cloud.ready) applyDueFinance(); render(); return; }
  if (route.view === 'home' || (route.view === 'agenda' && route.day === T)) render();
}
function maybeWelcome(waited = 0) {
  if (S.settings.onboarded) return;
  if (Cloud.status === 'connecting' && waited < 4000) { setTimeout(() => maybeWelcome(waited + 250), 250); return; }
  if (!S.settings.onboarded) welcomeSheet();
}
function boot() {
  const T = todayYmd();
  route.calY = +T.slice(0, 4); route.calM = +T.slice(5, 7); route.sel = T; route.day = T; route.finYM = T.slice(0, 7);
  lastDay = T; lastMin = nowMinutes();
  if (DEMO) { document.body.classList.add('demo'); if (!S.settings.onboarded) { loadSample(); S.settings.onboarded = true; save(...SLICES); } }
  applyTheme();
  const h = location.hash.slice(1); if (VIEWS[h]) route.view = h;
  render();
  setInterval(tick, 1000);
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1) || 'home'; if (VIEWS[v] && v !== route.view) { route.view = v; render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastMin = -1; tick(); } });
  Cloud.init();
  if (HOSTED && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
  if (HOSTED && !DEMO && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setTimeout(() => maybeWelcome(), 400);
}
boot();

</script>
